<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>दिव्य भविष्य व मनःपट 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #140324, #05010a);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #watch-screen {
            text-align: center;
            padding: 12px;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, #22083c, #090214);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 60px rgba(255, 170, 0, 0.4), inset 0 0 40px rgba(150, 0, 255, 0.5);
            border: 3px solid #ffaa00;
            position: relative;
        }

        .glow-circle {
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #ffaa00, #ff0055);
            border-radius: 50%;
            margin-bottom: 2px;
            box-shadow: 0 0 15px #ffaa00, 0 0 25px #ff0055;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.85); opacity: 0.7; }
            50% { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(0.85); opacity: 0.7; }
        }

        .app-title {
            font-size: 11px;
            font-weight: bold;
            color: #ffaa00;
            margin: 1px 0;
            letter-spacing: 0.8px;
            text-shadow: 0 0 5px rgba(255, 170, 0, 0.6);
        }

        .lang-select {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid #ffaa00;
            color: #fff;
            font-size: 7.5px;
            padding: 2px 4px;
            border-radius: 6px;
            margin-bottom: 3px;
            outline: none;
        }

        .lang-select option {
            background: #1e0933;
            color: #fff;
        }

        #status-text {
            font-size: 7.5px;
            color: #00ffcc;
            margin-bottom: 2px;
            min-height: 10px;
            font-weight: 600;
        }

        #output-box {
            font-size: 8px;
            color: #ffeedd;
            background: rgba(255, 170, 0, 0.08);
            border: 1px dashed rgba(255, 170, 0, 0.5);
            padding: 4px 6px;
            border-radius: 6px;
            margin-bottom: 5px;
            max-width: 210px;
            max-height: 50px;
            overflow-y: auto;
            word-break: break-word;
            line-height: 1.25;
            text-align: left;
        }

        .button-group {
            display: flex;
            gap: 4px;
        }

        .action-btn {
            background: linear-gradient(45deg, #ff0055, #9c27b0);
            color: white;
            border: none;
            padding: 3px 6px;
            font-size: 7px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(255, 0, 85, 0.5);
            transition: 0.2s;
        }

        .action-btn:active {
            transform: scale(0.92);
        }

        #thought-btn {
            background: linear-gradient(45deg, #ffaa00, #ff5722);
            color: #140324;
        }

        #audio-btn {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
        }
    </style>
</head>
<body>

    <div id="watch-screen">
        <div class="glow-circle"></div>
        <div class="app-title">🔮 दिव्य भविष्य 2026</div>
        
        <select id="languageSelect" class="lang-select">
            <option value="mr-IN">मराठी (Marathi)</option>
            <option value="hi-IN">हिन्दी (Hindi)</option>
            <option value="en-US">English (US)</option>
        </select>

        <div id="status-text">पंडितजी विचार वाचण्यासाठी सज्ज...</div>
        <div id="output-box">तुमच्या मनातले गूढ भाव आणि भविष्य 2026 येथे उमटेल...</div>
        
        <div class="button-group">
            <button class="action-btn" onclick="startVoiceReading()">🎙️ ऐका</button>
            <button class="action-btn" id="thought-btn" onclick="generateAstrologicalReading()">👁️ मन व भविष्य</button>
            <button class="action-btn" id="audio-btn" onclick="playAIVoiceOutput()">🔊 वाणी</button>
        </div>
    </div>

    <script>
        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function pcmToWav(pcm16, sampleRate) {
            const numChannels = 1;
            const byteRate = sampleRate * numChannels * 2;
            const blockAlign = numChannels * 2;
            const dataSize = pcm16.length * 2;
            const chunkSize = 36 + dataSize;

            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            writeString(view, 0, 'RIFF');
            view.setUint32(4, chunkSize, true);
            writeString(view, 8, 'WAVE');

            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, 16, true);

            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            let offset = 44;
            for (let i = 0; i < pcm16.length; i++, offset += 2) {
                view.setInt16(offset, pcm16[i], true);
            }

            return new Blob([view], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        async function callGeminiAIPrediction(userContextPrompt, lang) {
            var statusText = document.getElementById("status-text");
            var outputBox = document.getElementById("output-box");

            statusText.style.color = "#ffaa00";
            statusText.innerHTML = "✨ नक्षत्र व मनाची स्पंदने जुळवत आहे...";
            outputBox.innerHTML = "दिव्य दृष्टी केंद्रित होत आहे...";

            const systemPrompt = "You are a wise ancient Indian sage, astrologer (Pandit), and intuitive mystic of the year 2026. When the user interacts, deeply sense their current emotional state, thoughts, and destiny for 2026. Provide a personalized, profound, wise, and comforting astrological/intuitive future prediction in the requested language (Marathi, Hindi, or English). Keep it concise (within 30-38 words) so it fits nicely inside a smartwatch screen simulation.";
            
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: userContextPrompt }] }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            let retries = 3;
            let delay = 1000;

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    const candidate = result.candidates?.[0];

                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        const predictionText = candidate.content.parts[0].text;
                        statusText.innerHTML = "📜 2026 भविष्य स्पष्ट!";
                        statusText.style.color = "#00ff7f";
                        outputBox.innerHTML = predictionText;
                        return;
                    }
                } catch (error) {
                    // Retry silently
                }
                await new Promise(res => setTimeout(res, delay));
                delay *= 2;
            }

            fallbackAstrology(lang);
        }

        function fallbackAstrology(lang) {
            var statusText = document.getElementById("status-text");
            var outputBox = document.getElementById("output-box");

            const fallbacks = {
                'mr-IN': "वर्ष 2026 मध्ये तुमच्या जीवनात नवीन सकारात्मक वळण येईल. तुमच्या मेहनतीला उत्तम फळ मिळण्याचा हा काळ आहे.",
                'hi-IN': "वर्ष 2026 में आपके जीवन में एक नया सकारात्मक मोड़ आएगा। आपकी मेहनत का फल मिलने का यह सही समय है।",
                'en-US': "In the year 2026, a positive turning point awaits you. Your dedication and persistence will bear sweet fruits."
            };

            let key = lang.startsWith('hi') ? 'hi-IN' : lang.startsWith('en') ? 'en-US' : 'mr-IN';
            statusText.innerHTML = "📜 दिव्य दृष्टी प्राप्त!";
            statusText.style.color = "#00ff7f";
            outputBox.innerHTML = fallbacks[key];
        }

        function generateAstrologicalReading() {
            var selectedLang = document.getElementById("languageSelect").value;
            let seedPrompts = {
                'mr-IN': "वर्ष 2026 साठी माझ्या मनात आज काय चालू आहे ते ओळखून मला भविष्य सांगा, पंडितजींसारखे मार्गदर्शन करा.",
                'hi-IN': "वर्ष 2026 के लिए मेरे मन में इस समय क्या चल रहा है, इसे भांपकर एक भविष्यवक्ता की तरह मेरा मार्गदर्शन करें।",
                'en-US': "Sense my current hidden thoughts and give me a wise intuitive astrological prediction for my future in 2026."
            };
            callGeminiAIPrediction(seedPrompts[selectedLang] || seedPrompts['mr-IN'], selectedLang);
        }

        async function playAIVoiceOutput() {
            var outputBox = document.getElementById("output-box");
            var statusText = document.getElementById("status-text");
            var currentText = outputBox.innerText;

            if (!currentText || currentText.includes("तुमच्या मनात")) {
                currentText = "भविष्यवाणी लोड होत आहे, कृपया क्षणभर थांबा.";
            }

            statusText.innerHTML = "🔊 पंडितजींची वाणी तयार होत आहे...";

            const ttsPayload = {
                contents: [{
                    parts: [{ text: "Say calmly and wisely in a traditional mystic tone: " + currentText }]
                }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: { voiceName: "Kore" }
                        }
                    }
                },
                model: "gemini-2.5-flash-preview-tts"
            };

            const ttsApiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=`;

            try {
                const response = await fetch(ttsApiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(ttsPayload)
                });
                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                const audioData = part?.inlineData?.data;
                const mimeType = part?.inlineData?.mimeType;

                if (audioData && mimeType && mimeType.startsWith("audio/")) {
                    const sampleRateMatch = mimeType.match(/rate=(\d+)/);
                    const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;
                    const pcmData = base64ToArrayBuffer(audioData);
                    const pcm16 = new Int16Array(pcmData);
                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    const audioUrl = URL.createObjectURL(wavBlob);
                    
                    const audio = new Audio(audioUrl);
                    statusText.innerHTML = "🎧 वाणी वाजत आहे...";
                    audio.play();
                    audio.onended = function() {
                        statusText.innerHTML = "✨ भविष्य पूर्ण झाले";
                    };
                } else {
                    statusText.innerHTML = "✨ दर्शन संपले";
                }
            } catch (err) {
                statusText.innerHTML = "✨ दिव्य दृष्टी संपन्न";
            }
        }

        function startVoiceReading() {
            var statusText = document.getElementById("status-text");
            var outputBox = document.getElementById("output-box");
            var selectedLang = document.getElementById("languageSelect").value;

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                fallbackAstrology(selectedLang);
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = selectedLang;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            statusText.style.color = "#ffaa00";
            statusText.innerHTML = "🧘 पंडितजी आपले शब्द ऐकत आहेत...";
            outputBox.innerHTML = "...";

            recognition.start();

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                statusText.innerHTML = "👁️ विचार समजले, गणना होत आहे...";
                callGeminiAIPrediction("युजरचे 2026 चे म्हणणे आहे: '" + speechResult + "'. यावर आधारित ज्योतिषीय व भविष्यकालीन मार्गदर्शन करा.", selectedLang);
            };

            recognition.onerror = function(error) {
                fallbackAstrology(selectedLang);
            };

            recognition.onspeechend = function() {
                recognition.stop();
            };
        }
    </script>
</body>
</html>
