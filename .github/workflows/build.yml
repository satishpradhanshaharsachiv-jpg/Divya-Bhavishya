name: Build Android App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and Build Gradle
      run: |
        GRADLE_DIR=$(find . -maxdepth 2 -name "build.gradle*" -exec dirname {} \; | head -n 1)
        echo "Building in directory: $GRADLE_DIR"
        cd "$GRADLE_DIR"
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew bundleRelease
        else
          gradle bundleRelease
        fi
